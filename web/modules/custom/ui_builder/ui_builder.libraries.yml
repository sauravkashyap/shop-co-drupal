builder_app:
  version: 1.0.6
  js:
    js/dist/builder.js: { minified: true, attributes: { type: module, crossorigin: true } }
  css:
    component:
      js/dist/builder.css: { minified: true }
      js/dist/App.css: { minified: true }
  dependencies:
    - core/drupal
    - core/drupalSettings

frontend_defaults:
  version: 1.0.2
  js:
    js/aside-toggle.js: {}
  css:
    theme:
      css/ui-builder-layout.css: { weight: 1000 }
      css/ui-builder-base.css: { weight: 1100 }
  dependencies:
    - core/once
    - core/drupal

dynamic_styles:
  version: 1.0.0
  css:
    theme:
      public://ui_builder/base_styles.css: { weight: 1050, preprocess: false }

frontend_styler:
  version: 1.0.0
  js:
    js/dist/frontend_styler.js: { minified: true, attributes: { type: module, crossorigin: true } }
  css:
    component:
      js/dist/frontend_styler.css: { minified: true }
      js/dist/App.css: { minified: true }
  dependencies:
    - core/drupal
    - core/drupalSettings

ui_builder_slider:
  version: 11.0.0
  js:
    js/swiper/swiper-bundle.min.js: { minified: true }
    js/ui_builder_slider.js: {}
  css:
    component:
      css/swiper/swiper-bundle.min.css: { minified: true }
  dependencies:
    - core/drupal
    - core/once

ui_builder_fontawesome:
  version: 6.5.2
  css:
    component:
      css/fontawesome/all.min.css: { minified: true }

ui_builder_accordion:
  version: 1.0.0
  js:
    js/ui_builder_accordion.js: {}
  css:
    component:
      css/ui_builder_accordion.css: {}
  dependencies:
    - core/drupal
    - core/once
